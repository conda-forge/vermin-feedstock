{% set name = "vermin" %}
{% set version = "1.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/vermin-{{ version }}.tar.gz
  sha256: 15abe48e5e8b228fb8694a28e7f31bb3cf6d38e7c40627c17708ce9fd8d42dc0

build:
  entry_points:
    - vermin = vermin:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=80
    - wheel
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - vermin
  commands:
    - pip check
    - vermin --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/netromdk/vermin
  summary: Concurrently detect the minimum Python versions needed to run code
  dev_url: https://github.com/netromdk/vermin
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - jwlodek
